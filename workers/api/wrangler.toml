# 本站边缘函数的配置：**一个 Worker 挂三件事**（music / views / steam）。
#
# 部署（Node 22+；wrangler 用 npx 跑即可，不必装进项目依赖）：
#   cd workers/api
#   npx wrangler login
#   npx wrangler kv namespace create VIEWS    # → 把打印出来的 id 填到下面 [[kv_namespaces]]
#   npx wrangler secret put STEAM_API_KEY     # → 粘贴 https://steamcommunity.com/dev/apikey 给的 key
#   npx wrangler deploy
#
# 部署完会打印地址。线上走自定义域（下面的 routes），三个变量指向同一个域、路径不同：
#   VITE_MUSIC_ENDPOINT=https://api.kuroki.top/music
#   VITE_VIEWS_ENDPOINT=https://api.kuroki.top/views
#   VITE_STEAM_ENDPOINT=https://api.kuroki.top/steam
#
# ★ Worker 名字必须与 Cloudflare 上那个 Workers Builds 项目同名（现在都是 `kuroki-blog`）。
#   不一致时 CI 会打一条 WARNING 并**强制覆盖**成项目名，还会尝试提 PR 改这个文件 ——
#   所以别再把 name 改成别的。

name = "kuroki-blog"
main = "src/index.js"
compatibility_date = "2025-06-01"

# 让 Worker 尽量跑在**离上游更近**的地方（music.163.com）。
# ★ 起因：默认情况下 Worker 在接请求的机房执行（实测是 LAX），从美国 IP 打
#   网易云 `/api/song/enhance/player/url/v1` 直接回 `code=404`（大陆 IP 同一请求是
#   `code=200` 且有 320 kbps 直链）—— 也就是地域限制，不是代码问题。
# ★ smart 只会去「离上游近」的机房（多半是 HKG/SIN），**不保证**进大陆；
#   如果实测仍是 404，说明这条链路救不回来，得换方案（自托管 mp3）。
placement = { mode = "smart" }

# 绑自定义域（Workers 侧）。`custom_domain = true` 会让 wrangler 自己建 DNS 记录 +
# 申请证书，等价于控制台里「设置 → 域和路由 → 添加 → 自定义域」。
# ★ 必须是**本账号下的 zone**，否则 deploy 会报找不到 zone。
# ★ 不写这块也能跑，但只能走 `*.workers.dev` —— 那个域名在国内基本连不上
#   （实测 `kuroki-blog.huolandeshuyin.workers.dev` 从大陆直接连接超时），
#   所以线上必须走这个自定义域。
routes = [
  { pattern = "api.kuroki.top", custom_domain = true },
]

# ── 存储 ────────────────────────────────────────────────────────────────
# 三件事里只有浏览量要持久化（一个 key）。音乐不用 KV（直链只缓存在 isolate 内存
# 15 分钟），Steam 也不用（走 caches.default，5 分钟）。
# ★ 只有「浏览量」需要 KV；不绑定也能部署，`/views` 会回 503 并说明缺什么。
# ★ 2026-10-24 已接入（Namespace 名 VIEWS）。没这块时 `/views` 一直 503，
#   「关于」页的浏览量会显示 0。
[[kv_namespaces]]
binding = "VIEWS"
id = "200f6ba42b7f42fab85deb011f674a09"

[vars]
# 只允许这些网易云歌曲 id 走这个代理（逗号分隔）。
# ★★ 必须与 `src/playlist.ts` 里的 `songs[].id` 保持一致 ——
#    前端列了歌、这里没放行，表现是「点了播放没反应」（网络面板里 403）。
# ★ 留空等于「谁都能用你的 Worker 代理任意网易云歌曲」，流量吃的是你的额度。
ALLOWED_IDS = "1311002329,3371533046"

# Steam：填 17 位 steamID64。用 ResolveVanityURL 换一次就贴死在这里，
# 省掉每次请求都解析一遍 vanity 名：
#   https://api.steampowered.com/ISteamUser/ResolveVanityURL/v1/?key=<key>&vanityurl=1938526060zsx
# 留空 → /steam 回 503 并说明缺什么（不会静默失败）。
# 本站账号的三种等价写法（Web API 只认第一种）：
#   steamID64  76561199047190468
#   STEAM_0:0:543462370            （accountId 543462370；steamID64 = accountId × 2 + 76561197960265728）
#   主页       https://steamcommunity.com/id/1938526060zsx/
STEAM_ID = "76561199047190468"

# 「最近在玩」取几款（默认 3，上限 10）。
STEAM_RECENT_COUNT = "3"
