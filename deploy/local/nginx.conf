# 内网博客的 nginx 站点配置
#
# 放到 /etc/nginx/sites-available/kuroki，然后：
#   sudo ln -sf /etc/nginx/sites-available/kuroki /etc/nginx/sites-enabled/kuroki
#   sudo rm -f /etc/nginx/sites-enabled/default      # 否则 default_server 会冲突
#   sudo nginx -t && sudo systemctl reload nginx
#
# ★ 内网用 http 就够，不需要证书；手机上会显示「不安全」，这是正常的。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/kuroki;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ── 带哈希的文件名：可以放心长缓存 ──
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── 入口 HTML 必须每次回源，否则发新文章不刷新看不到 ──
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── 本地音频（可选）。配了 VITE_MUSIC_BASE 才用得上 ──
    # 必须给 Accept-Ranges，否则进度条拖不动
    location /music/ {
        try_files $uri =404;
        add_header Accept-Ranges bytes;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── SPA：/about、/articles/xxx 这类路径都回 index.html，路由交给前端 ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;
}
