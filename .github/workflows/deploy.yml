# 构建并部署到 GitHub Pages
#
# ── 触发 ──
#   推送到 main / master，或手动触发（Actions 页面 → Run workflow）
#
# ── 流程 ──
#   1. 装依赖 → 内容体检（文章 + 项目） → 类型检查 + 构建 → 体积预算
#      （**frontmatter 有错、或产物体积超预算，都会在这里失败**）
#   2. 把 dist/ 作为 Pages 产物上传
#   3. 部署
#
# ── 为什么「构建失败」是好事 ──
#   内容插件（vite-plugin-posts.ts / vite-plugin-projects.ts）在校验不过时
#   **直接抛异常**，所以一篇 frontmatter 写错的 md 会让整个 job 红掉，
#   不会把坏数据部署上线。这正是「往 content/posts（或 content/projects）
#   丢 md 就发布」这套流程能安全工作的前提。
#
# ── 用之前要做的两件事 ──
#   1. 仓库 Settings → Pages → Source 选 "GitHub Actions"
#   2. 如果站点不在域名根目录（比如 https://user.github.io/repo-name/），
#      需要给构建加 base。见下方 BASE_PATH 说明。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署；排队中的旧任务直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        # `npm ci` 严格按 package-lock.json 装，比 `npm install` 可复现
        run: npm ci

      - name: 内容体检
        # ★ 比 vite build 快，而且一次报出**所有**文件的问题
        #   （build 里插件是遇到第一个错误就抛）。
        #   校验规则只有一份：content-kit.ts，两个集合各一份 spec。
        run: npm run check:content

      - name: 类型检查 + 构建
        # ★ 这一步是最后一道「内容校验关卡」——
        #   vue-tsc 查类型，vite build 里插件再查一遍 frontmatter / 图片。
        #   任何一篇 md 写错都会让 job 失败，CI 会邮件通知。
        run: npm run build
        env:
          # ★ 部署到 GitHub Pages 时通常需要 base 前缀。
          #   仓库名是 <user>.github.io 时留空（默认 '/'）；
          #   否则设成 '/<仓库名>/'。
          #
          #   这里用仓库名自动推导：只对「项目页」加前缀。
          #   如果你用的是自定义域名或 user.github.io，把这段删掉即可。
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}

      - name: 体积预算
        # ★ 首屏 ≤88 KB gz、单块 ≤150 KB gz、单个大二进制 ≤1.5 MB raw
        #   （见 §5.10）。超了就让 job 红掉 —— 加 3D 模型 / 大图之后
        #   最容易被悄悄塞进关键路径的就是这里。
        #   注意 mp3 也走「大二进制」这条门槛（现在每首 751 KB）。
        run: npm run budget:check

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
